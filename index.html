<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Padrino Pitch Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<style>
  /* One deliberate look: the video's own cream page and ink, full screen, nothing else. */
  :root {
    --page: #EFE3CB;
    --plate: #FFF9EC;
    --ink: #1C1612;
    --ink-soft: #3D434C;
    --accent: #2B5BE3;
    --font: "Plus Jakarta Sans", "Helvetica Neue", Arial, sans-serif;
    color-scheme: light;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--page); color: var(--ink); font-family: var(--font); overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    user-select: none; -webkit-user-select: none;
  }
  body.idle { cursor: none; }
  .stage { position: fixed; inset: 0; background: var(--page); }
  .stage video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--page);
    opacity: 0; pointer-events: none;
  }
  .stage video.on { opacity: 1; }

  .hint {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center;
    background: var(--plate); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 8px;
    padding: 12px 18px; font-size: 15px; font-weight: 700; max-width: calc(100% - 32px);
  }
  .hint .muted { color: var(--ink-soft); font-weight: 500; }
  .hint kbd { font-family: var(--font); font-weight: 800; border: 2px solid var(--ink); border-radius: 6px; padding: 1px 7px; background: var(--page); }
  .start {
    font: 800 15px var(--font); color: var(--plate); background: var(--ink); border: 2px solid var(--ink);
    border-radius: 8px; padding: 9px 16px; cursor: pointer; box-shadow: 3px 3px 0 var(--accent);
  }
  .start:focus-visible, .start:hover { outline: 3px solid var(--accent); outline-offset: 2px; }
  .start:disabled { opacity: .55; cursor: wait; box-shadow: none; }

  .notes {
    position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 980px;
    background: var(--plate); border: 2px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); border-radius: 8px;
    padding: 14px 18px; display: grid; gap: 8px; font-size: 17px; line-height: 1.45;
  }
  .notes .row { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; min-width: 0; }
  .notes .tag { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); padding-top: 3px; }
  .notes .now { font-weight: 700; }
  .notes .next { color: var(--ink-soft); font-weight: 500; }
  .count { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    font-size: 13px; font-weight: 800; background: var(--plate); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 9px;
    font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="stage" id="stage" aria-live="polite"></div>

<div class="hint" id="hint">
  <button class="start" id="start" type="button" disabled>Loading clips</button>
  <span class="muted" id="load">0 of 18 ready</span>
  <span class="muted">Next: click, <kbd>→</kbd> or your clicker · Back: <kbd>←</kbd> · Full screen: <kbd>F</kbd> · Your lines: <kbd>S</kbd></span>
</div>

<div class="notes" id="notes" hidden>
  <div class="row"><span class="tag" id="nowTag">Now</span><span class="now" id="nowLine"></span></div>
  <div class="row"><span class="tag">Next</span><span class="next" id="nextLine"></span></div>
</div>
<div class="count" id="count" hidden></div>

<script>
  // One clip per script row. Each plays once when its slide opens and holds on its last frame.
  const SLIDES = [
    ['01-logo', 'Logo', 'This is Padrino. / The money padrino for your wedding.'],
    ['02-problem-1', 'The problem', 'Every money app does the same thing. / It tells you what you already spent.'],
    ['03-problem-2', 'The problem', 'That is not help. / That is a receipt. // A wedding needs someone who acts.'],
    ['04-numbers', 'The numbers', 'A wedding in El Paso costs about twenty thousand dollars. / Three in four couples get hit with a fee they never saw coming. / And parents cover about half.'],
    ['05-connect', 'Connect once', 'So we built Padrino. / You connect your bank. / Once.'],
    ['06-path', 'The path', 'Then you walk the path, / one milestone at a time. / A step is only done when your bank says so.'],
    ['07-proof', 'Proof, not promises', 'Every payment gets checked against your bank. / The photographer came in a hundred dollars over? / Padrino caught it. / Tío Javier sent four fifty? / Verified.'],
    ['08-talk', 'Just talk', 'You just talk to it. / Mom and Dad sent five hundred. / Padrino turns that into one card. // You tap Do it. / Nothing changes without you.'],
    ['09-quote', 'Quote decoder', 'Send it a quote. / Eleven thousand on paper. / Fourteen thousand once the service charge and tax hit. / You see it before you sign.'],
    ['10-contract', 'Contract check', 'It reads the fine print. / What you would owe if you cancel, / date by date, / before you are locked in.'],
    ['11-find-money', 'Find money', 'It finds money. / A hundred forty five a month in subscriptions you forgot. / Over a thousand dollars by the wedding. / And the money you live on stays untouched.'],
    ['12-family', 'Family', 'It brings the family in. / Every padrino gets a link. / The money goes straight to you, / and the bank confirms it.'],
    ['13-vendors', 'Vendors', 'It finds real El Paso vendors. / Save one. / Ask if they are free on your date.'],
    ['14-negotiator', 'The negotiator', 'And it writes the email for you. / Can you waive the cake cutting fee?'],
    ['15-style', 'Wedding style', 'Eleven traditions. / Pick one, or mix. / Your wedding, your way.'],
    ['16-difference', 'The difference', 'Budget apps watch your money. // Padrino moves it.'],
    ['17-next', 'What comes next', 'Weddings first. / Then quinceañeras, / babies, / first homes.'],
    ['18-close', 'Logo', 'In a Mexican wedding, a padrino covers part of the day. / Padrino covers all of it. // I\'m Sid. / This is Padrino.']
  ];

  const stage = document.getElementById('stage');
  const hint = document.getElementById('hint');
  const startBtn = document.getElementById('start');
  const loadEl = document.getElementById('load');
  const notes = document.getElementById('notes');
  const count = document.getElementById('count');
  let index = -1;          // -1 = not started; slide 1 shows its first frame
  let started = false;
  let ready = 0;

  const videos = SLIDES.map(([file], i) => {
    const v = document.createElement('video');
    v.src = `clips/${file}.mp4`;
    v.muted = true; v.defaultMuted = true; v.playsInline = true; v.preload = 'auto';
    v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.disablePictureInPicture = true;
    v.loop = false;
    let counted = false;
    const mark = () => {
      if (counted) return; counted = true; ready += 1;
      loadEl.textContent = ready === SLIDES.length ? 'All 18 clips loaded' : `${ready} of ${SLIDES.length} ready`;
      if (ready === SLIDES.length || (i === 0 && !started)) { startBtn.disabled = false; startBtn.textContent = ready === SLIDES.length ? 'Start' : 'Start (still loading)'; }
      if (ready === SLIDES.length) startBtn.textContent = 'Start';
    };
    v.addEventListener('canplaythrough', mark, { once: true });
    v.addEventListener('error', () => { loadEl.textContent = `Clip ${i + 1} did not load. Reload the page.`; });
    stage.appendChild(v);
    return v;
  });
  videos[0].classList.add('on');

  function show(i, { play = true, atEnd = false } = {}) {
    if (i < 0 || i >= SLIDES.length) return;
    const v = videos[i];
    index = i;
    // Keep the old slide on screen until the new clip has a frame, so there is never a blank flash.
    const reveal = () => {
      if (index !== i) return;
      videos.forEach((other, k) => { if (k !== i) { other.classList.remove('on'); other.pause(); } });
      v.classList.add('on');
    };
    if (atEnd) {
      v.pause();
      const seekEnd = () => { v.addEventListener('seeked', reveal, { once: true }); v.currentTime = Math.max(0, (v.duration || 0) - 0.04); };
      if (v.readyState >= 1) seekEnd(); else v.addEventListener('loadedmetadata', seekEnd, { once: true });
    } else if (play) {
      if (v.currentTime > 0) { v.addEventListener('seeked', reveal, { once: true }); v.currentTime = 0; }
      else if (v.readyState >= 2) reveal();
      else v.addEventListener('loadeddata', reveal, { once: true });
      const p = v.play(); if (p && p.catch) p.catch(() => {});
    }
    paintNotes();
  }

  function begin() {
    if (started) return;
    started = true;
    hint.hidden = true;
    try { navigator.wakeLock?.request('screen').catch(() => {}); } catch (e) {}
    show(0);
  }
  function next() { if (!started) return begin(); if (index < SLIDES.length - 1) show(index + 1); }
  function prev() { if (!started) return; if (index > 0) show(index - 1, { atEnd: true }); }
  function replay() { if (started && index >= 0) show(index); }

  function paintNotes() {
    const i = Math.max(0, index);
    document.getElementById('nowTag').textContent = `${i + 1} · ${SLIDES[i][1]}`;
    document.getElementById('nowLine').textContent = SLIDES[i][2];
    document.getElementById('nextLine').textContent = SLIDES[i + 1] ? `${SLIDES[i + 1][1]}: ${SLIDES[i + 1][2]}` : 'End of the video.';
    count.textContent = `${i + 1} / ${SLIDES.length}`;
  }

  function toggleFull() {
    try {
      if (document.fullscreenElement) document.exitFullscreen?.();
      else document.documentElement.requestFullscreen?.().catch(() => {});
    } catch (e) {}
  }

  startBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleFull(); begin(); });
  stage.addEventListener('click', () => next());
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (['ArrowRight', 'ArrowDown', 'PageDown', ' ', 'Enter', 'n', 'N'].includes(k)) { e.preventDefault(); next(); }
    else if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace', 'p', 'P'].includes(k)) { e.preventDefault(); prev(); }
    else if (k === 'f' || k === 'F') { toggleFull(); }
    else if (k === 's' || k === 'S') { notes.hidden = !notes.hidden; count.hidden = notes.hidden; paintNotes(); }
    else if (k === 'r' || k === 'R') { replay(); }
    else if (k === 'Home') { if (started) show(0); }
  });

  // Hide the cursor while presenting.
  let idleTimer = null;
  document.addEventListener('mousemove', () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { if (started) document.body.classList.add('idle'); }, 1500);
  });
  paintNotes();
</script>
</html>
